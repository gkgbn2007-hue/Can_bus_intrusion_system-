name: ESP32 firmware and Python validation

on:
  push:
    paths:
      - "firmware/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check logger syntax
        run: python -m py_compile tools/can_serial_logger.py

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and MCP2515 library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/autowp/arduino-mcp2515.git "$HOME/Arduino/libraries/arduino-mcp2515"
      - name: Prepare Arduino sketch folder
        run: |
          mkdir -p /tmp/CanBusMonitor
          cp firmware/esp32_can_receive_monitor.ino /tmp/CanBusMonitor/CanBusMonitor.ino
      - name: Compile for classic ESP32
        run: arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/CanBusMonitor
